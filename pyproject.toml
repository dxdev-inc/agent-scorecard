[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "measure-the-agent-factory"
version = "0.1.0"
description = "Measure an agent factory by what finished, not by what was started."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["factory_kit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
